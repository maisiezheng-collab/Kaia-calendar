  <title>Kaia · 课程日历</title>
  <style>
    :root {
      --bg:#eceff1;
      --surface:#f9faf9;
      --surface-2:#e2e7ea;
      --surface-3:#d7dde1;
      --text:#252b30;
      --muted:#727b82;
      --line:#c8d0d4;
      --berry:#7c5d73;
      --stone:#7b7069;
      --green:#647b69;
      --blue:#54728b;
      --purple:#6d6085;
      --slate:#596f78;
      --teal:#567a78;
      --shadow:0 18px 60px rgba(42,50,56,.12);
      --radius:18px;
      font-family:"SF Pro Rounded","Avenir Next Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",system-ui,sans-serif;
      color:#252b30;
      background:#eceff1;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
    button,input,textarea{font:inherit}
    button{color:inherit}
    .app{min-height:100%;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
    .shell{max-width:1460px;margin:0 auto}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 10px}
    .brand{min-width:0;display:flex;align-items:baseline;gap:9px}
    .brand h1{font-size:clamp(22px,3vw,35px);line-height:1;margin:0;font-weight:760;letter-spacing:-.04em;white-space:nowrap}
    .brand span{font-size:10px;color:var(--muted);letter-spacing:.14em;white-space:nowrap}
    .top-actions{display:flex;align-items:center;gap:6px}
    .icon-btn,.seg button,.ghost,.primary{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:40px;cursor:pointer}
    .icon-btn{width:40px;display:grid;place-items:center;padding:0;font-size:18px}
    .seg{display:flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px}
    .seg button{border:0;min-height:32px;padding:0 12px;background:transparent;color:var(--muted);border-radius:9px}
    .seg button.active{background:var(--surface);color:var(--text)}
    .navline{display:flex;align-items:center;gap:7px;margin-bottom:8px}
    .date-input{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 9px;color:var(--text);min-width:142px}
    .range{font-size:11px;color:var(--muted);margin-left:2px;white-space:nowrap}
    .content{min-width:0}
    .week-grid{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
    .day-card{min-width:140px;background:var(--surface);border:1px solid var(--line);border-radius:17px;overflow:hidden}
    .day-head{padding:8px 10px 8px;background:var(--surface-2);border-top:6px solid var(--accent);border-bottom:1px solid var(--line)}
    .day-name{font-size:13px;font-weight:760}
    .day-date{font-size:10px;color:var(--muted);margin-top:1px}
    .period{padding:7px 8px 8px;min-height:124px}
    .period+.period{border-top:1px solid var(--line)}
    .period-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .period-label{font-size:9px;letter-spacing:.16em;font-weight:760;color:var(--muted)}
    .add-btn{width:27px;height:27px;border:0;background:transparent;border-radius:8px;color:var(--muted);font-size:19px;line-height:1;cursor:pointer}
    .add-btn:active{background:var(--surface-2)}
    .lesson-list{display:flex;flex-direction:column;gap:5px}
    .lesson{border:1px solid var(--line);background:#f2f4f4;border-radius:10px;padding:6px 7px;text-align:left;cursor:pointer;width:100%}
    .lesson-title{font-size:11.5px;line-height:1.35;font-weight:670;white-space:pre-wrap;overflow-wrap:anywhere}
    .lesson-meta{margin-top:3px;font-size:8.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
    .lesson:not(.once) .lesson-meta{display:none}
    .status-dot{width:5px;height:5px;border-radius:999px;background:var(--green)}
    .lesson.once .status-dot{background:var(--berry)}
    .empty{font-size:10px;color:var(--muted);opacity:.52;padding:2px 0}
    .month-view{display:none}
    .month-view.active{display:block}
    .week-view.hidden{display:none}
    .month-title{font-size:13px;font-weight:720;margin:3px 0 8px;color:var(--text)}
    .month-heads,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:6px}
    .month-heads{font-size:10px;color:var(--muted);text-align:center;font-weight:680;margin-bottom:6px}
    .month-grid{overflow-x:auto}
    .month-cell{min-height:112px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:7px;cursor:pointer}
    .month-cell.out{opacity:.28}
    .month-cell.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
    .month-date{font-size:10.5px;font-weight:760;margin-bottom:4px}
    .month-line{font-size:8.8px;line-height:1.35;margin-bottom:3px;overflow-wrap:anywhere}
    .footer{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:10px;color:var(--muted);font-size:10px}
    .footer-actions{display:flex;gap:6px;flex-wrap:wrap}
    .ghost,.primary{min-height:36px;padding:0 11px}
    .ghost{background:var(--surface)}
    .primary{background:var(--text);color:var(--surface);border-color:var(--text)}
    .overlay{position:fixed;inset:0;background:rgba(20,25,29,.34);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
    .overlay.show{display:flex}
    .sheet{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);max-height:calc(100% - 30px);overflow:auto}
    .sheet h2{font-size:18px;margin:0 0 3px;letter-spacing:-.02em}
    .sheet-sub{font-size:10.5px;color:var(--muted);margin-bottom:13px}
    .field{margin-bottom:11px}
    .field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}
    .field textarea,.field input,.field select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);padding:9px;font-size:16px;outline:none}
    .field textarea{min-height:74px;resize:vertical}
    .field textarea:focus,.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(84,114,139,.12)}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.types{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .type-btn{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px;text-align:left;cursor:pointer}
    .type-btn.selected{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
    .type-btn strong{display:block;font-size:11.5px}
    .type-btn span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
    .scope-field{display:none}
    .scope-field.show{display:block}
    .scope-note{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.45}
    .move-toggle{width:100%;border:0;background:transparent;color:var(--blue);text-align:left;font-size:10.5px;padding:0 1px 11px;display:flex;justify-content:space-between;cursor:pointer}
    .move-fields{padding:11px 10px 1px;margin-bottom:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
    .conflict-hint[hidden]{display:none}
    .conflict-hint{border:1px solid #dcc79f;background:#faf4e6;color:#67532e;border-radius:11px;font-size:10.5px;padding:10px;margin:8px 0;line-height:1.5}
    .sheet-actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
    .sheet-actions .right{display:flex;gap:7px}
    .sheet-actions button{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;cursor:pointer}
    .sheet-actions .save{background:var(--text);color:var(--surface);border-color:var(--text)}
    .delete{color:#965966}
    .share-preview{background:var(--surface-2);padding:10px;border-radius:14px;margin:10px 0}

    .file-label input{display:none}

    .toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:#252b30;color:white;padding:9px 12px;border-radius:12px;font-size:11px;transition:.2s ease;z-index:60;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:720px){
      .app{padding-top:max(10px,env(safe-area-inset-top))}

      .lesson-list{gap:3px}
      .lesson{padding:4px 5px;border-radius:8px}
      .lesson-title{font-size:10px;line-height:1.25}
      .lesson-meta{font-size:7.5px;margin-top:2px}
      .add-btn{width:24px;height:24px;font-size:17px}
      .month-heads,.month-grid{grid-template-columns:repeat(7,minmax(46px,1fr));gap:4px}
      .month-heads{font-size:8.5px}
      .month-cell{min-height:78px;padding:5px;border-radius:9px}
      .month-date{font-size:9px}
      .month-line{font-size:7.2px;line-height:1.22}
      .footer{font-size:9px}
    }
    @media(max-width:390px){
      .brand h1{font-size:20px}
      .date-input{min-width:128px;width:128px}
      .day-card{grid-template-columns:78px 1fr 1fr}
      .day-name{font-size:12px}

    }
    @media print{
      .top-actions,.navline button,.footer,.add-btn{display:none!important}
      body,.app{background:white}
      .app{padding:0}
      .week-grid{overflow:visible;grid-template-columns:repeat(7,1fr)}

    }
  </style>

<body>
<div class="app">

    </div>
    <p class="tiny">建议偶尔备份一次。换手机、清除 Safari 网站数据或使用不同浏览器时，本机保存的数据不会自动跟随。</p>
    <div class="sheet-actions"><span></span><div class="right"><button id="closeSettingsBtn" type="button">完成</button></div></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const STORAGE_KEY='kaia-class-planner-v1';
  const APP_VERSION='2026.09.23.6';
  const weekdays=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
  const accents=['#7c5d73','#7b7069','#647b69','#54728b','#6d6085','#596f78','#567a78'];
  const $=id=>document.getElementById(id);
  let state={version:2,focus:'',mode:'week',items:[],exceptions:[],seq:1,exceptionSeq:1};
  let editing=null;
  let editType='regular';
  let editScope='single';

  const pad=n=>String(n).padStart(2,'0');
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
  const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
  const str=d=>`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
  const add=(s,n)=>{const d=parse(s);d.setUTCDate(d.getUTCDate()+n);return str(d)};
  const monday=s=>{const d=parse(s);const day=d.getUTCDay();d.setUTCDate(d.getUTCDate()+(day===0?-6:1-day));return str(d)};
  const parts=s=>{const [y,m,d]=s.split('-').map(Number);return {y,m,d}};
  const weekdayIndex=s=>(parse(s).getUTCDay()+6)%7;
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function load(){
    try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const data=JSON.parse(raw);if(data&&Array.isArray(data.items)){state={...state,...data}}}}catch(e){}
    if(!Array.isArray(state.items)) state.items=[];
    if(!Array.isArray(state.exceptions)) state.exceptions=[];
    if(!state.focus) state.focus=today();
    if(state.mode==='week') state.focus=monday(state.focus);
    const merged=normalizeData();
    if(merged) state.lastAutoMerged=(state.lastAutoMerged||0)+merged;
  }
  function save(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){toast('无法保存到本机，请检查 Safari 设置')}
  }
  function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
  function weekStart(){return monday(state.focus)}
  function lessonTimeMinutes(text,period){
    const value=String(text||'').trim();
    let hour=null,minute=0,explicitMeridiem=null;
    let match=value.match(/(?:^|[^\d])([01]?\d|2[0-3])\s*[:：]\s*([0-5]\d)/);
    if(match){hour=Number(match[1]);minute=Number(match[2]);}
    if(hour===null){
      match=value.match(/(?:^|[^\d])(\d{1,2})\s*(?:点|時|时)\s*(?:(\d{1,2})\s*分?|半)?/);
      if(match){hour=Number(match[1]);minute=match[2]?Number(match[2]):(match[0].includes('半')?30:0);}
    }
    if(hour===null){
      match=value.match(/(?:^|[^\d])(\d{1,2})(?:\s*[:：]\s*([0-5]\d))?\s*(am|pm)\b/i);
      if(match){hour=Number(match[1]);minute=match[2]?Number(match[2]):0;explicitMeridiem=match[3].toLowerCase();}
    }
    if(hour===null||hour>23||minute>59)return Number.POSITIVE_INFINITY;
    if(explicitMeridiem){
      if(hour>12)return Number.POSITIVE_INFINITY;
      hour=hour%12+(explicitMeridiem==='pm'?12:0);
    }else if(hour<=12){
      if(period==='am')hour=hour===12?0:hour;
      if(period==='pm')hour=hour===12?12:hour+12;
    }
    return hour*60+minute;
  }
  function sortLessonsByTime(items,period){
    return items.map((item,index)=>({item,index,time:lessonTimeMinutes(item.text,period)}))
      .sort((a,b)=>a.time-b.time||a.index-b.index)
      .map(entry=>entry.item);
  }
  function hasException(regularId,date){
    return state.exceptions.some(x=>x.regularId===regularId&&x.date===date&&x.kind==='cancel');
  }
  function addCancelException(regularId,date){
    if(hasException(regularId,date))return;
    state.exceptions.push({id:state.exceptionSeq++,regularId,date,kind:'cancel'});
  }
  function removeCancelException(regularId,date){
    state.exceptions=state.exceptions.filter(x=>!(x.regularId===regularId&&x.date===date&&x.kind==='cancel'));
  }
  // A class's first time is its start. A missing finish time is treated as
  // one hour for collision reminders (the app cannot know its real duration).
  function classInterval(text,period){
    const start=lessonTimeMinutes(text,period);
    let end=Number.POSITIVE_INFINITY;
    const match=String(text||'').match(/^\s*\d{1,2}\s*[:：]\s*[0-5]\d\s*(?:-|–|—|~|～|至|to)\s*(\d{1,2}\s*[:：]\s*[0-5]\d)/i);
    if(match)end=lessonTimeMinutes(match[1],period);
    if(!Number.isFinite(start))return {start,end:Number.POSITIVE_INFINITY};
    if(!Number.isFinite(end)||end<=start)end=start+60;
    return {start,end};
  }
  function courseName(text){
    const first=String(text||'').trim().replace(/：/g,':');
    const prefix=/^\d{1,2}\s*(?::\s*[0-5]\d|[点时時](?:\d{1,2}分?|半)?)\s*(?:am|pm)?\s*(?:(?:-|–|—|~|～|至|to)\s*\d{1,2}\s*(?::\s*[0-5]\d|[点时時](?:\d{1,2}分?|半)?)\s*(?:am|pm)?)?/i;
    return first.replace(prefix,'').trim().replace(/\s+/g,'').toLowerCase()||first.toLowerCase().replace(/\s+/g,'');
  }
  function classKey(item){
    const start=lessonTimeMinutes(item.text,item.period);
    return `${item.weekday}|${item.period}|${start}|${courseName(item.text)}`;
  }
  function classTimesOverlap(a,b){
    const x=classInterval(a.text,a.period),y=classInterval(b.text,b.period);
    return Number.isFinite(x.start)&&Number.isFinite(y.start)&&x.start<y.end&&y.start<x.end;
  }
  function nextWeekdayOnOrAfter(date,weekday){
    return add(date,(weekday-weekdayIndex(date)+7)%7);
  }
  function regularActive(item,date){
    return item.type==='regular'&&item.weekday===weekdayIndex(date)&&date>=item.startDate&&(!item.endDate||date<=item.endDate)&&!hasException(item.id,date);
  }
  function regularRangesOverlap(a,b){
    if(a.weekday!==b.weekday)return false;
    const beginning=a.startDate>b.startDate?a.startDate:b.startDate;
    const last=(!a.endDate)?b.endDate:(!b.endDate?a.endDate:(a.endDate<b.endDate?a.endDate:b.endDate));
    return !last||nextWeekdayOnOrAfter(beginning,a.weekday)<=last;
  }
  function mergeRegularDuplicates(){
    const regular=state.items.filter(x=>x.type==='regular').sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
    const remove=new Set();
    const original=regular.map(x=>({...x}));
    const oldExceptions=[...state.exceptions];
    const merges=[];
    const retained=[];
    for(const item of regular){
      if(remove.has(item.id))continue;
      const canonical=retained.find(x=>classKey(x)===classKey(item)&&regularRangesOverlap(x,item));
      if(!canonical){retained.push(item);continue;}
      // Preserve every existing occurrence; an end date is extended only if necessary.
      canonical.startDate=canonical.startDate<item.startDate?canonical.startDate:item.startDate;
      canonical.endDate=(!canonical.endDate||!item.endDate)?null:(canonical.endDate>item.endDate?canonical.endDate:item.endDate);
      merges.push([item.id,canonical.id]);remove.add(item.id);
    }
    if(!merges.length)return 0;
    // Cancellation applies to the merged series only when all original active
    // copies of that specific date were canceled.
    const resolve=id=>{let pair;while((pair=merges.find(x=>x[0]===id)))id=pair[1];return id};
    const grouped=new Map();
    for(const item of original){
      const root=resolve(item.id);if(!grouped.has(root))grouped.set(root,[]);grouped.get(root).push(item);
    }
    const rewritten=state.exceptions.filter(x=>!grouped.has(x.regularId));
    for(const [root,group] of grouped){
      const dates=[...new Set(oldExceptions.filter(x=>group.some(r=>r.id===x.regularId)).map(x=>x.date))];
      for(const date of dates){
        const active=group.filter(x=>x.weekday===weekdayIndex(date)&&date>=x.startDate&&(!x.endDate||date<=x.endDate));
        if(active.length&&active.every(x=>oldExceptions.some(e=>e.regularId===x.id&&e.date===date&&e.kind==='cancel'))){
          rewritten.push({id:state.exceptionSeq++,regularId:root,date,kind:'cancel'});
        }
      }
    }
    state.exceptions=rewritten;
    state.items=state.items.filter(x=>!remove.has(x.id));
    return remove.size;
  }
  function normalizeData(){
    state.seq=Math.max(Number(state.seq)||1,...state.items.map(x=>(Number(x.id)||0)+1));
    state.exceptionSeq=Math.max(Number(state.exceptionSeq)||1,...state.exceptions.map(x=>(Number(x.id)||0)+1));
    let merged=mergeRegularDuplicates();
    const seenOnce=new Set();
    state.items=state.items.filter(item=>{
      if(item.type!=='once')return true;
      const key=`${item.date}|${classKey(item)}`;
      if(seenOnce.has(key)){merged++;return false;}
      seenOnce.add(key);return true;
    });
    // If the very same session is already covered by its fixed timetable,
    // discard an extra one-off copy instead of showing it twice.
    state.items=state.items.filter(item=>{
      if(item.type!=='once')return true;
      const regular=state.items.find(x=>x.type==='regular'&&classKey(x)===classKey(item)&&regularActive(x,item.date));
      if(!regular)return true;
      merged++;return false;
    });
    state.seq=Math.max(state.seq,...state.items.map(x=>(Number(x.id)||0)+1));
    return merged;
  }
  function visible(date,wd,period){
    const onceItems=state.items.filter(x=>x.type==='once'&&x.period===period&&x.date===date);
    const regularItems=state.items.filter(x=>x.type==='regular'&&x.period===period&&x.weekday===wd&&regularActive(x,date));
    const seen=new Set();
    return sortLessonsByTime([...regularItems,...onceItems].filter(item=>{
      const k=classKey(item);if(seen.has(k))return false;seen.add(k);return true;
    }),period);
  }
  function findEquivalent(candidate,exceptId){
    const key=classKey(candidate);
    return state.items.find(item=>item.id!==exceptId&&classKey(item)===key&&(
      candidate.type==='regular'?(item.type==='regular'&&regularRangesOverlap(item,candidate)):
      ((item.type==='once'&&item.date===candidate.date)||(item.type==='regular'&&item.weekday===candidate.weekday&&candidate.date>=item.startDate&&(!item.endDate||candidate.date<=item.endDate)))
    ));
  }
  function findConflicts(candidate,exceptId){
    const matches=[];
    for(const item of state.items){
      if(item.id===exceptId||item.period!==candidate.period||!classTimesOverlap(candidate,item))continue;
      let date='';
      if(candidate.type==='once'){
        if(item.type==='once'&&item.date===candidate.date)date=candidate.date;
        else if(regularActive(item,candidate.date))date=candidate.date;
      }else if(item.type==='regular'&&regularRangesOverlap(item,candidate)){
        date=nextWeekdayOnOrAfter(candidate.startDate>item.startDate?candidate.startDate:item.startDate,candidate.weekday);
      }else if(item.type==='once'&&item.date>=candidate.startDate&&candidate.weekday===weekdayIndex(item.date)&&(!candidate.endDate||item.date<=candidate.endDate))date=item.date;
      if(date&&!(candidate.type==='once'&&item.type==='regular'&&hasException(item.id,date)))matches.push({item,date});
    }
    return matches;
  }

  function renderTop(){
    if(state.mode==='week') state.focus=monday(state.focus);
    $('dateInput').value=state.mode==='week'?weekStart():state.focus;
    if(state.mode==='week'){
      const a=weekStart(),b=add(a,6),pa=parts(a),pb=parts(b);
      $('rangeText').textContent=`${pa.y}年 ${pa.m}月${pa.d}日 — ${pb.m}月${pb.d}日`;
    } else {
      const p=parts(state.focus);$('rangeText').textContent=`${p.y}年 ${p.m}月`;
    }
  }
  function periodHTML(date,wd,period,label){
    const lessons=visible(date,wd,period);
    const content=lessons.map(item=>`<button type="button" class="lesson ${item.type==='once'?'once':''}" data-id="${item.id}"><div class="lesson-title">${esc(item.text)}</div><div class="lesson-meta"><span class="status-dot"></span>${item.type==='regular'?'固定每周':'仅本次'}</div></button>`).join('');
    return `<div class="period"><div class="period-top"><span class="period-label">${label}</span><button class="add-btn" type="button" data-date="${date}" data-wd="${wd}" data-period="${period}" aria-label="添加${label}课程">＋</button></div><div class="lesson-list">${content||'<div class="empty">暂无课程</div>'}</div></div>`;
  }
  function renderWeek(){
    const start=weekStart(),grid=$('weekGrid');grid.innerHTML='';
    for(let i=0;i<7;i++){
      const date=add(start,i),p=parts(date),card=document.createElement('article');
      card.className='day-card';card.style.setProperty('--accent',accents[i]);
      card.innerHTML=`<div class="day-head"><div class="day-name">${weekdays[i]}</div><div class="day-date">${p.m}/${p.d}</div></div>${periodHTML(date,i,'am','上午')}${periodHTML(date,i,'pm','下午')}`;
      grid.appendChild(card);
    }
  }
  function renderMonth(){
    const p=parts(state.focus),first=`${p.y}-${pad(p.m)}-01`,next=p.m===12?`${p.y+1}-01-01`:`${p.y}-${pad(p.m+1)}-01`,last=add(next,-1),start=monday(first),end=add(monday(last),6),grid=$('monthGrid');
    $('monthTitle').textContent=`${p.y}年 ${p.m}月`;
    grid.innerHTML='';let date=start,count=0;
    while(date<=end && count<42){
      const d=parts(date),wd=weekdayIndex(date);
      const lines=[...visible(date,wd,'am').map(x=>`上午 · ${x.text}`),...visible(date,wd,'pm').map(x=>`下午 · ${x.text}`)];
      const cell=document.createElement('button');cell.type='button';cell.className='month-cell'+(d.m!==p.m?' out':'')+(date===today()?' today':'');cell.dataset.date=date;
      cell.innerHTML=`<div class="month-date">${d.m}/${d.d}</div>${lines.map(t=>`<div class="month-line">${esc(t)}</div>`).join('')}`;
      grid.appendChild(cell);date=add(date,1);count++;
    }
  }
  function render(){renderTop();renderWeek();renderMonth();save()}
  function setMode(mode){
    state.mode=mode;if(mode==='week')state.focus=monday(state.focus);$('weekTab').classList.toggle('active',mode==='week');$('monthTab').classList.toggle('active',mode==='month');$('weekView').classList.toggle('hidden',mode==='month');$('monthView').classList.toggle('active',mode==='month');renderTop();if(mode==='month')renderMonth();save();
  }

  function refreshScopeUI(){
    const regular=Boolean(editing&&editing.id&&editing.type==='regular');
    $('scopeField').classList.toggle('show',regular);
    $('typeField').hidden=regular;
    document.querySelectorAll('.scope-btn').forEach(btn=>btn.classList.toggle('selected',btn.dataset.scope===editScope));
    const del=$('deleteBtn');
    if(!(editing&&editing.id)){del.style.visibility='hidden';return;}
    del.style.visibility='visible';
    del.textContent=regular?(editScope==='single'?'删除本次':'删除今后'):'删除';
  }
  function refreshTypeUI(){
    document.querySelectorAll('.type-btn[data-type]').forEach(btn=>btn.classList.toggle('selected',btn.dataset.type===editType));
  }
  function getDraft(){
    const date=(editing&&editing.date)||today();
    const period=(editing&&editing.period)||'am';
    return {text:$('lessonText').value.trim(),date,period,weekday:weekdayIndex(date),type:editing&&editing.type==='regular'?(editScope==='single'?'once':'regular'):editType,startDate:date};
  }
  function showHint(message){
    $('conflictHint').textContent=message;
    $('conflictHint').hidden=!message;
  }
  function updateConflictHint(){
    if(!editing)return;
    const draft=getDraft();if(!draft.text){showHint('');return;}
    const sourceUnchanged=editing.id&&editing.type==='regular'&&editScope==='single'&&draft.date===editing.sourceDate&&draft.period===editing.period&&draft.text===editing.text;
    if(sourceUnchanged){showHint('');return;}
    const skipId=editing&&editing.id?editing.id:null;
    const identical=findEquivalent(draft,skipId);
    if(identical){
      showHint('同一时段已有相同课程，保存时会自动合并，不会重复显示。');return;
    }
    const conflicts=findConflicts(draft,skipId);
    if(conflicts.length){
      const detail=conflicts.slice(0,2).map(x=>x.item.text).join('、');
      showHint(`⚠ 这个时间已有 ${detail}${conflicts.length>2?' 等课程':''}，保存时会请你确认。`);
    } else showHint('');
  }
  function openEditor(data){
    editing=data;editType=data.type||'regular';editScope=data.id&&data.type==='regular'?'single':'future';
    $('lessonText').value=data.text||'';
    $('editTitle').textContent=data.id?'编辑课程':'添加课程';
    $('editSub').textContent='';
    refreshTypeUI();refreshScopeUI();showHint('');
    $('editOverlay').classList.add('show');setTimeout(()=>$('lessonText').focus(),50);
  }
  function closeEditor(){editing=null;$('editOverlay').classList.remove('show')}
  document.addEventListener('click',event=>{
    const addBtn=event.target.closest('.add-btn');
    if(addBtn)openEditor({date:addBtn.dataset.date,wd:+addBtn.dataset.wd,period:addBtn.dataset.period,type:'regular',text:''});
    const lesson=event.target.closest('.lesson');
    if(lesson){
      const item=state.items.find(x=>x.id===+lesson.dataset.id);
      if(item){
        const date=item.type==='once'?item.date:add(weekStart(),item.weekday);
        openEditor({...item,date,wd:item.type==='once'?weekdayIndex(date):item.weekday,sourceDate:date,sourcePeriod:item.period});
      }
    }
    const monthCell=event.target.closest('.month-cell');
    if(monthCell){state.focus=monday(monthCell.dataset.date);setMode('week');render()}
  });
  document.querySelectorAll('.type-btn[data-type]').forEach(btn=>btn.addEventListener('click',()=>{editType=btn.dataset.type;refreshTypeUI();updateConflictHint()}));
  document.querySelectorAll('.scope-btn').forEach(btn=>btn.addEventListener('click',()=>{editScope=btn.dataset.scope;refreshScopeUI();updateConflictHint()}));
  $('lessonText').addEventListener('input',updateConflictHint);
  $('lessonForm').addEventListener('submit',event=>{
    event.preventDefault();if(!editing)return;
    const draft=getDraft();if(!draft.text){toast('请先输入课程');return;}
    const source=editing;
    // Keeping an unchanged fixed occurrence unchanged must not create a
    // cancel + one-off copy, even when the selected scope is only this week.
    if(source.id&&source.type==='regular'&&draft.date===source.sourceDate&&draft.period===source.period&&draft.text===source.text){
      closeEditor();toast('课程安排未改变');return;
    }
    if(source.id&&source.type==='once'&&draft.type==='once'&&draft.date===source.date&&draft.period===source.period&&draft.text===source.text){
      closeEditor();return;
    }
    const skipId=source.id||null;
    const duplicate=findEquivalent(draft,skipId);
    if(!duplicate){
      const conflicts=findConflicts(draft,skipId);
      if(conflicts.length){
        const when=draft.type==='regular'?'每周':'当天';
        const display=conflicts.slice(0,3).map(x=>x.item.text).join('、');
        if(!window.confirm(`${when}这个时间已有：${display}${conflicts.length>3?' 等课程':''}。\n确定还要保存吗？`))return;
      }
    }
    let message='课程已保存';
    if(!source.id){
      if(duplicate){
        if(duplicate.type==='regular'&&draft.type==='regular')duplicate.startDate=draft.date<duplicate.startDate?draft.date:duplicate.startDate;
        else if(duplicate.type==='regular')removeCancelException(duplicate.id,draft.date);
        message='已与原有课程合并，不会重复显示';
      }else state.items.push({id:state.seq++,...draft,date:draft.type==='once'?draft.date:null,startDate:draft.type==='regular'?draft.date:null});
    }else if(source.type==='once'){
      state.items=state.items.filter(x=>x.id!==source.id);
      if(duplicate){
        if(duplicate.type==='regular'&&draft.type==='regular')duplicate.startDate=draft.date<duplicate.startDate?draft.date:duplicate.startDate;
        else if(duplicate.type==='regular')removeCancelException(duplicate.id,draft.date);
        message='已与原有课程合并，不会重复显示';
      }else state.items.push({id:source.id,...draft,date:draft.type==='once'?draft.date:null,startDate:draft.type==='regular'?draft.date:null});
    }else if(source.type==='regular'&&editScope==='single'){
      addCancelException(source.id,source.sourceDate||source.date);
      if(duplicate){
        if(duplicate.type==='regular')removeCancelException(duplicate.id,draft.date);
        message='本周已调整，目标日期已有同一课程';
      }else state.items.push({id:state.seq++,...draft,type:'once',date:draft.date,startDate:null});
    }else{
      const current=state.items.find(x=>x.id===source.id);
      const from=source.sourceDate||source.date;
      if(current){
        if(from>current.startDate)current.endDate=add(from,-1);
        else state.items=state.items.filter(x=>x.id!==source.id);
      }
      if(duplicate&&duplicate.type==='regular'){
        duplicate.startDate=draft.date<duplicate.startDate?draft.date:duplicate.startDate;
        message='之后的安排已与原有固定课合并';
      }else state.items.push({id:state.seq++,...draft,type:'regular',date:null,startDate:draft.date,endDate:null});
    }
    const cleaned=normalizeData();
    if(cleaned)message=`${message}，另合并了 ${cleaned} 条重复课程`;
    closeEditor();render();toast(message);
  });
  $('deleteBtn').addEventListener('click',()=>{
    if(!editing||!editing.id)return;
    const item=state.items.find(x=>x.id===editing.id);
    if(!item){closeEditor();return;}
    if(editing.type==='regular'){
      if(editScope==='single')addCancelException(item.id,editing.sourceDate||editing.date);
      else{
        const from=editing.sourceDate||editing.date;
        if(from>item.startDate)item.endDate=add(from,-1);
        else state.items=state.items.filter(x=>x.id!==item.id);
      }
    } else state.items=state.items.filter(x=>x.id!==editing.id);
    closeEditor();render();toast('课程已删除');
  });
  $('cancelBtn').addEventListener('click',closeEditor);
  $('editOverlay').addEventListener('click',e=>{if(e.target===$('editOverlay'))closeEditor()});

  function shiftMonth(delta){const p=parts(state.focus),d=new Date(Date.UTC(p.y,p.m-1+delta,1));state.focus=str(d)}
  $('prevBtn').addEventListener('click',()=>{state.mode==='week'?state.focus=add(state.focus,-7):shiftMonth(-1);render()});
  $('nextBtn').addEventListener('click',()=>{state.mode==='week'?state.focus=add(state.focus,7):shiftMonth(1);render()});
  $('dateInput').addEventListener('change',e=>{if(e.target.value){state.focus=state.mode==='week'?monday(e.target.value):e.target.value;render()}});
  $('weekTab').addEventListener('click',()=>setMode('week'));
  $('monthTab').addEventListener('click',()=>setMode('month'));
  $('printBtn').addEventListener('click',()=>window.print());

  function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  function wrapText(ctx,text,maxWidth,maxLines){
    const chars=String(text||'').split(''),lines=[];let line='';
    for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;if(lines.length===maxLines-1)break}else line=test}
    if(line&&lines.length<maxLines)lines.push(line);return lines;
  }
  function lessonFontSize(count){
    if(count<=2)return 38;
    if(count===3)return 33;
    return 28;
  }
  function drawLessonColumn(ctx,items,x,y,maxWidth,availableHeight){
    if(!items.length){
      ctx.fillStyle='#252b30';
      ctx.font='600 20px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText('—',x,y);
      return;
    }
    const size=lessonFontSize(items.length);
    const lineHeight=size>=38?54:size>=33?46:38;
    const maxLines=Math.max(items.length,Math.floor(availableHeight/lineHeight));
    ctx.fillStyle='#365e76';
    ctx.font=`700 ${size}px -apple-system, BlinkMacSystemFont, sans-serif`;
    let lineIndex=0;
    for(const text of items){
      if(lineIndex>=maxLines)break;
      const remaining=maxLines-lineIndex;
      const lines=wrapText(ctx,text,maxWidth,Math.min(2,remaining));
      for(const line of lines){
        ctx.fillText(line,x,y+lineIndex*lineHeight);
        lineIndex++;
        if(lineIndex>=maxLines)break;
      }
    }
  }
  function buildShareCanvas(){
    const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext('2d');const start=weekStart();
    ctx.fillStyle='#eceff1';ctx.fillRect(0,0,1080,1920);
    ctx.fillStyle='#252b30';ctx.font='700 58px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText('Kaia · 每周课程',64,96);
    const a=parts(start),b=parts(add(start,6));ctx.fillStyle='#727b82';ctx.font='500 24px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(`${a.y}年 ${a.m}月${a.d}日 — ${b.m}月${b.d}日`,66,140);
    const top=190,gap=18,weekdayH=160,weekendH=288;
    let y=top;
    for(let i=0;i<7;i++){
      const date=add(start,i),p=parts(date),cardH=i<5?weekdayH:weekendH;
      ctx.fillStyle='#f9faf9';roundRect(ctx,48,y,984,cardH,24);ctx.fill();ctx.strokeStyle='#c8d0d4';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle=accents[i];roundRect(ctx,48,y,16,cardH,8);ctx.fill();
      ctx.fillStyle='#252b30';ctx.font='700 27px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(weekdays[i],88,y+48);
      ctx.fillStyle='#727b82';ctx.font='500 19px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText(`${p.m}月${p.d}日`,88,y+80);
      ctx.strokeStyle='#d7dde1';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(260,y+24);ctx.lineTo(260,y+cardH-24);ctx.stroke();ctx.beginPath();ctx.moveTo(646,y+24);ctx.lineTo(646,y+cardH-24);ctx.stroke();
      ctx.fillStyle='#727b82';ctx.font='700 16px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText('上午',286,y+38);ctx.fillText('下午',674,y+38);
      const am=visible(date,i,'am').map(x=>x.text),pm=visible(date,i,'pm').map(x=>x.text);
      const available=cardH-78;
      drawLessonColumn(ctx,am,286,y+76,326,available);
      drawLessonColumn(ctx,pm,674,y+76,324,available);
      y+=cardH+gap;
    }
    ctx.fillStyle='#727b82';ctx.font='500 16px -apple-system, BlinkMacSystemFont, sans-serif';ctx.fillText('KAIA WEEKLY CLASS PLANNER',64,1838);
    return canvas;
  }
  async function canvasFile(canvas){return new Promise(resolve=>canvas.toBlob(blob=>resolve(new File([blob],`Kaia_每周课程_${weekStart()}.png`,{type:'image/png'})),'image/png',1))}
  $('shareBtn').addEventListener('click',()=>{const canvas=buildShareCanvas();$('sharePreview').src=canvas.toDataURL('image/png');$('shareOverlay').classList.add('show')});
  $('closeShareBtn').addEventListener('click',()=>$('shareOverlay').classList.remove('show'));
  $('shareOverlay').addEventListener('click',e=>{if(e.target===$('shareOverlay'))$('shareOverlay').classList.remove('show')});
  $('nativeShareBtn').addEventListener('click',async()=>{
    const canvas=buildShareCanvas();const file=await canvasFile(canvas);
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Kaia 每周课程'});}
      else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('图片已导出，可在下载中找到')}
    }catch(err){if(err&&err.name!=='AbortError')toast('分享失败，请再试一次')}
  });

  $('settingsBtn').addEventListener('click',()=>{$('settingsOverlay').classList.add('show')});
  $('closeSettingsBtn').addEventListener('click',()=>$('settingsOverlay').classList.remove('show'));
  $('settingsOverlay').addEventListener('click',e=>{if(e.target===$('settingsOverlay'))$('settingsOverlay').classList.remove('show')});
  $('backupBtn').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Kaia课程备份_${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('备份文件已导出');
  });
  $('restoreInput').addEventListener('change',async e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.items))throw new Error('bad');state={...state,...data,focus:state.focus||today()};if(!Array.isArray(state.exceptions))state.exceptions=[];state.focus=state.mode==='week'?monday(state.focus):state.focus;const n=normalizeData();save();render();toast(n?`已恢复，并合并 ${n} 条重复课程`:'课程数据已恢复');}
    catch(err){toast('这个备份文件无法读取')}
    e.target.value='';
  });
  $('updateBtn').addEventListener('click',async()=>{
    toast('正在检查更新…');
    try{
      const base=location.origin+location.pathname;
      const freshUrl=`${base}?update=${Date.now()}`;
      const response=await fetch(freshUrl,{cache:'no-store'});
      if(!response.ok)throw new Error('network');
      const html=await response.text();
      const match=html.match(/<meta\s+name=["']kaia-app-version["']\s+content=["']([^"']+)["']/i);
      const latest=match&&match[1];
      if(latest&&latest!==APP_VERSION){
        sessionStorage.setItem('kaia-just-updated','1');
        location.replace(freshUrl);
      }else{toast('已经是最新版本')}
    }catch(err){toast('暂时无法检查更新，请稍后再试')}
  });
  $('installHelpBtn').addEventListener('click',()=>{$('settingsOverlay').classList.remove('show');$('installTip').classList.add('show');toast('Safari → 分享 → 添加到主屏幕')});

  const standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  if(!standalone)$('installTip').classList.add('show');
  load();render();
  if(state.lastAutoMerged){const n=state.lastAutoMerged;delete state.lastAutoMerged;save();setTimeout(()=>toast(`已自动合并 ${n} 条重复课程`),650)}
  if(sessionStorage.getItem('kaia-just-updated')==='1'){sessionStorage.removeItem('kaia-just-updated');setTimeout(()=>toast('已更新到最新版本'),250)}
})();
</script>
